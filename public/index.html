<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14120d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Panel" />
    <title>Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="/styles.css?v=5" />
  </head>
  <body>
    <header>
      <div class="masthead">
        <a class="brand disp" href="#/discover">Panel<small class="kicker">A reading room for comics</small></a>
        <form class="search" id="search-form" role="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle><path d="M16.5 16.5 21 21"></path>
          </svg>
          <input id="search-input" type="search" placeholder="Search books, characters, creators…"
                 autocomplete="off" enterkeyhint="search" aria-label="Search" />
        </form>
        <div class="shelf-count">
          <span class="kicker">On the shelf</span>
          <b class="disp" id="shelf-count">—</b>
        </div>
      </div>
      <nav id="nav" aria-label="Sections">
        <button class="kicker" data-route="discover" aria-current="true">Discover</button>
        <button class="kicker" data-route="browse">Browse</button>
        <button class="kicker" data-route="library">My requests</button>
      </nav>
    </header>

    <main id="view" aria-live="polite"></main>

    <dialog id="sheet"><div class="sheet" id="sheet-body"></div></dialog>
    <div id="toast" role="status"></div>

    <script src="/app.js?v=5" type="module"></script>
  </body>
</html>
