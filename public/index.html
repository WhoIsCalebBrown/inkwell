<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14120d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Panel" />
    <title>Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="/styles.css?v=31" />
  </head>
  <body>
    <header>
      <div class="masthead">
        <a class="brand disp" href="#/discover">Panel<small class="kicker">A reading room for comics</small></a>
        <form class="search" id="search-form" role="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle><path d="M16.5 16.5 21 21"></path>
          </svg>
          <input id="search-input" type="search" placeholder="Search books, characters, creators…"
                 autocomplete="off" enterkeyhint="search" aria-label="Search" />
        </form>
        <div class="poster-control" title="Poster size">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="7" y="5" width="10" height="14"></rect>
          </svg>
          <input id="poster" type="range" min="110" max="320" step="10" value="150"
                 aria-label="Poster size" />
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <rect x="4" y="2" width="16" height="20"></rect>
          </svg>
        </div>
        <div class="shelf-count">
          <span class="kicker">In library</span>
          <b class="disp" id="shelf-count">—</b>
        </div>
        <button class="masthead-settings" data-route="settings" aria-label="Settings" title="Settings">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <circle cx="12" cy="12" r="3.2"></circle>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9.1a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9.1a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1.03z"></path>
          </svg>
        </button>
      </div>
      <nav id="nav" aria-label="Sections">
        <button class="kicker" data-route="discover" aria-current="true">Discover</button>
        <button class="kicker" data-route="browse">Browse</button>
        <button class="kicker" data-route="threads">Characters &amp; creators</button>
        <button class="kicker" data-route="library">My requests</button>
      </nav>
    </header>

    <main id="view" aria-live="polite"></main>

    <dialog id="sheet"><div class="sheet" id="sheet-body"></div></dialog>
    <div id="toast" role="status"></div>

    <script src="/app.js?v=41" type="module"></script>
  </body>
</html>
