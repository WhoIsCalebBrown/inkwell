services:
  comic-requester:
    build: .
    container_name: comic-requester
    restart: unless-stopped
    labels:
      # Lets Unraid's Docker page expose an Open WebUI action for this
      # Compose-managed container. Using its placeholder avoids DNS reliance.
      net.unraid.docker.webui: http://[IP]:[PORT:3013]
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      MYLAR_URL: http://192.168.40.44:8090/api
      MYLAR_CONFIG: /run/mylar/config.ini
      # Komga is the only system that knows what actually landed on disk; Mylar
      # reports every watched series as 'Active' whether or not it downloaded.
      KOMGA_URL: http://192.168.40.44:25600
      KOMGA_CONFIG: /run/komf/application.yml
      # Keep these in the app's protected .env. The mounted Komf config can be
      # root-only, while this container intentionally runs as an unprivileged
      # user and must not weaken those file permissions.
      KOMGA_USER: ${KOMGA_USER:-}
      KOMGA_PASSWORD: ${KOMGA_PASSWORD:-}
      CACHE_DB: /data/cache.db
      COVER_DIR: /data/covers
      # Optional. metron.cloud — a community comic database with better story
      # arcs than ComicVine. Auth is a bearer token despite the docs describing
      # basic auth. Put it in a .env beside this file; never commit it.
      METRON_TOKEN: ${METRON_TOKEN:-}
    volumes:
      # Reuses Mylar's API key without copying it into this project or browser.
      - /mnt/cache/appdata/mylar3/mylar/config.ini:/run/mylar/config.ini:ro
      # Same trick for the Komga login Komf already holds.
      - /mnt/cache/appdata/komf/application.yml:/run/komf/application.yml:ro
      # The container is read-only, so the ComicVine cache needs a writable home.
      # It must outlive the container: rebuilding otherwise costs ~26 slow
      # ComicVine calls per character all over again.
      - comic-requester-cache:/data
    ports:
      - 192.168.40.44:3013:3000
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  comic-requester-cache:
